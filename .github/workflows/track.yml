name: track

# Watch for a new WhatsApp Web release, and when one lands, open a pull request
# describing exactly what changed in the protocol.
#
# WhatsApp ships roughly every ten hours and each build expires 61 days after
# its own release, so falling behind is not cosmetic — a library pinned to an
# expired revision stops working outright. This checks hourly and is a no-op on
# almost every run by design: the expensive path only starts once the extraction
# actually differs.
#
# # Where things go, and why
#
# A revision's source is 1.3 GB raw and 59 MB even after git packs it, and
# WhatsApp re-minifies on every build so successive revisions barely delta at
# all. At ~875 releases a year that is ~51 GB of history, which would make the
# repository unusable within weeks.
#
# So the three kinds of output go three places:
#
#   * `data`      — the payload the site reads: the facts and *every* module of
#                   the revision. Replaced wholesale each release by an orphan
#                   commit, so the branch is always exactly one revision and
#                   history never accumulates. ~409 MB packed, and it stays
#                   ~409 MB however long this runs.
#   * a release   — the full 1.3 GB bundle, compressed to ~100 MB, one asset per
#                   revision. Complete history, none of it in anyone's clone.
#
# Generated libraries and coverage are not published here. They are derived from
# the facts and belong to whoever wants them, not on the branch the viewer reads.
#
# The pull request itself carries the fact-level diff, which is the part a human
# reads. Nobody reviews 29 MB of re-minified JavaScript.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      revision:
        description: "Revision to index (default: latest)"
        required: false
        default: "latest"

concurrency:
  group: track
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build jigger and cellar
        run: |
          cargo build --release --locked
          cargo install --git https://github.com/polymorfa/cellar cellar --locked

      - name: Fetch the revision
        id: fetch
        run: |
          cellar bundle add --rev "${{ inputs.revision || 'latest' }}"
          echo "modules=$(cellar bundle path --rev latest)/modules" >> "$GITHUB_OUTPUT"

      # Extracted into a scratch tree, never over the committed one: writing in
      # place would make "did anything change" unanswerable, because the answer
      # would already have been overwritten.
      - name: Extract
        id: extract
        run: |
          ./target/release/jigger --out .next extract latest
          ./target/release/jigger --out .next symbols
          ./target/release/jigger --out .next graph
          ./target/release/jigger --out .next vectors
          echo "rev=$(jq -r .revision .next/revision.json)" >> "$GITHUB_OUTPUT"

      - name: Compare against the published revision
        id: changed
        run: |
          git fetch origin data --depth=1 2>/dev/null || true
          if git show origin/data:ir.json > .published.json 2>/dev/null; then
            # Compared on facts alone. The module hashes and read counts move on
            # every build without the protocol moving at all, and a workflow
            # that opens a pull request every hour is a workflow people mute.
            if jq -S '.facts' .published.json > /tmp/a.json &&
               jq -S '.facts' .next/ir.json  > /tmp/b.json &&
               cmp -s /tmp/a.json /tmp/b.json; then
              echo "new=false" >> "$GITHUB_OUTPUT"
              echo "revision ${{ steps.extract.outputs.rev }}: no protocol change"
              exit 0
            fi
          fi
          echo "new=true" >> "$GITHUB_OUTPUT"

      - name: Diff the two revisions
        if: steps.changed.outputs.new == 'true'
        run: |
          mkdir -p .prev
          git show origin/data:ir.json > .prev/ir.json 2>/dev/null || echo '{"facts":[]}' > .prev/ir.json
          ./target/release/jigger --out .next diff .prev .next || true

      # Which code moved which fact. The fact diff above says the protocol
      # changed; this says where, by function, and — more usefully — which
      # modules changed for real while every fact in them stayed put. That last
      # category is the only signal we get that an extractor is missing
      # something, and it cannot be derived from facts, because it is defined by
      # their absence.
      #
      # Needs both revisions' source, and only the new one is fetched above. The
      # previous bundle is re-fetched from the CDN, which stops serving old
      # revisions eventually — so this degrades to "not available" rather than
      # failing the run. A release note is worth having when it can be had, and
      # never worth blocking a release over.
      - name: Observe what changed
        id: observe
        if: steps.changed.outputs.new == 'true'
        continue-on-error: true
        run: |
          PREV=$(git show origin/data:revision.json 2>/dev/null | jq -r .revision) || exit 0
          [ -n "$PREV" ] && [ "$PREV" != "null" ] || exit 0

          # `--rev` is exact, so this either gets that revision or nothing. A
          # near-miss would silently attribute changes to the wrong baseline.
          if ! cellar bundle add --rev "$PREV" --quiet; then
            echo "revision $PREV is no longer served; skipping observation"
            exit 0
          fi

          ./target/release/jigger --out .prevfacts extract "$PREV"
          ./target/release/jigger --out .next observe .prevfacts .next
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Pack the payload
        if: steps.changed.outputs.new == 'true'
        run: ./scripts/pack-data.sh .next "${{ steps.fetch.outputs.modules }}" .payload

      # The full bundle, out of git entirely. A release asset has no effect on
      # clone size and no 100 MB file limit, which is the only way to keep every
      # revision's complete source without the repository becoming unclonable.
      - name: Publish the full source as a release asset
        if: steps.changed.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REV="${{ steps.extract.outputs.rev }}"
          tar -C "$(dirname '${{ steps.fetch.outputs.modules }}')" -czf "source-$REV.tar.gz" modules
          gh release create "rev/$REV" "source-$REV.tar.gz" \
            --title "revision $REV" \
            --notes "Complete module source for WhatsApp Web revision $REV. The browsable subset and the extracted facts are on the \`data\` branch." \
            || gh release upload "rev/$REV" "source-$REV.tar.gz" --clobber

      - name: Open the pull request
        if: steps.changed.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REV="${{ steps.extract.outputs.rev }}"
          BRANCH="rev/$REV"

          git config user.name  "jigger"
          git config user.email "jigger@users.noreply.github.com"

          # Orphaned every time, deliberately. Branching from `data` would
          # carry 237k blobs forward into a new commit and the branch would grow
          # by a revision every release; an orphan means the pushed tree is the
          # only tree, and the branch stays one revision forever.
          git checkout --orphan "$BRANCH"
          git rm -rq --cached . 2>/dev/null || true
          find . -maxdepth 1 -mindepth 1 ! -name .git ! -name .payload ! -name .next ! -name target -exec rm -rf {} +
          mv .payload/* .
          rmdir .payload

          git add -A
          git commit -qm "revision $REV" || exit 0
          git push -f origin "$BRANCH"

          # The summary is the fact diff, because that is what a person reviews.
          SUMMARY=$(jq -r '
            "| kind | added | changed | removed |\n|---|---|---|---|\n" +
            ([.summary.byKind | to_entries[] |
              "| \(.key) | \(.value.added) | \(.value.changed) | \(.value.removed) |"] | join("\n"))
          ' .next/diff.json 2>/dev/null || echo "_(no diff available)_")

          # What the table above cannot say. Silent changes come first because
          # they are the ones nobody would otherwise look for: a stanza parser
          # that changed while every fact it produces stayed identical is either
          # a protocol change we do not model yet or an extractor that has
          # stopped seeing something. Unexplained comes last and is about us —
          # a fact that moved with no code behind it means the extraction is not
          # reproducible, and it should be embarrassing in public.
          OBSERVED=""
          if [ -f .next/observe.json ]; then
            OBSERVED=$(jq -r '
              "### What moved the facts\n\n" +
              "`\(.stats.facts_attributed)` of `\(.stats.facts_moved)` changed facts trace to a specific function; " +
              "`\(.stats.functions_changed)` functions changed across `\(.stats.modules_changed)` modules.\n\n" +
              (if (.silent | length) > 0 then
                "**Changed code that moved no fact — \(.silent | length) module(s).** Worth a look: either the protocol moved somewhere we do not model, or an extractor stopped seeing something.\n\n" +
                "| module | functions | dependents |\n|---|---|---|\n" +
                ([.silent[:10][] |
                  "| `\(.module)` | \([.sites[:4][] | "`\(.function)`"] | join(", ")) | \(.dependents) |"] | join("\n")) + "\n\n"
              else "" end) +
              (if (.unexplained | length) > 0 then
                "**\(.unexplained | length) fact(s) moved with no code change in reach.** That is a defect in this pipeline, not a finding about WhatsApp — most likely a non-reproducible extractor.\n\n" +
                ([.unexplained[:10][] | "- `\(.id)` — `\(.module)`"] | join("\n")) + "\n"
              else "" end)
            ' .next/observe.json 2>/dev/null || echo "")
          fi

          # Built into a file rather than a heredoc. A heredoc's body has to
          # start at column 1 to avoid indenting the output, and column 1 ends
          # the YAML block scalar this whole script lives in — so the workflow
          # did not parse, and every run failed before it reached a single step.
          # `--body-file` keeps the text indented, which keeps it inside the
          # block, and costs nothing.
          {
            printf 'Extracted from WhatsApp Web revision `%s`.\n\n' "$REV"
            printf '%s\n\n' "$SUMMARY"
            # `if`, not `[ … ] && …`: the latter returns non-zero when the
            # observation is absent, and the runner's `set -e` would abort the
            # release on the one path that is expected to be empty.
            if [ -n "$OBSERVED" ]; then printf '%s\n\n' "$OBSERVED"; fi
            printf 'Every module of this revision is in `modules/` — the whole bundle, not a\n'
            printf 'subset, so the viewer can follow any reference. The branch is orphaned each\n'
            printf 'release, so it is always exactly this revision.\n\n'
            printf 'The same source is also attached to the [`rev/%s`](../../releases/tag/rev/%s)\n' "$REV" "$REV"
            printf 'release as a single archive, which is the copy that keeps history.\n'
          } > pr-body.md

          gh pr create --base data --head "$BRANCH" \
            --title "revision $REV" \
            --body-file pr-body.md \
            || gh pr edit "$BRANCH" --body-file pr-body.md
