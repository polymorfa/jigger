[workspace]
resolver = "3"
members = [
    "apps/jigger",
    "crates/jigger-ir",
    "crates/jigger-extract",
    "crates/jigger-emit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/purpshell/jigger"

[workspace.dependencies]
# cellar owns the bundle archive, the module index and the filter engine. jigger
# consumes that rather than re-walking directories, so a change to how bundles
# are stored is cellar's problem and not repeated here.
cellar-core = { git = "https://github.com/polymorfa/cellar", version = "0.1.0" }
cellar-fetch = { git = "https://github.com/polymorfa/cellar", version = "0.1.0" }
cellar-index = { git = "https://github.com/polymorfa/cellar", version = "0.1.0" }

# The same parser cellar indexes with. Every fact this tool extracts is a
# literal in the AST — protobuf field numbers, A/B property ids, WAM event ids —
# so they are read from a parse tree, never by evaluating the bundle. That keeps
# extraction deterministic and means no untrusted JavaScript is ever executed.
oxc_allocator = "0.143"
oxc_ast = "0.143"
oxc_ast_visit = "0.143"
oxc_parser = "0.143"
oxc_span = "0.143"

anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
serde = { version = "1.0", features = ["derive"] }
# No preserve_order: every map is a BTreeMap and every list is sorted, so the
# emitted IR is byte-identical run to run and a git diff of it means something.
serde_json = "1.0"
regex = "1.13"
walkdir = "2.5"

jigger-ir = { path = "crates/jigger-ir", version = "0.1.0" }
jigger-extract = { path = "crates/jigger-extract", version = "0.1.0" }
jigger-emit = { path = "crates/jigger-emit", version = "0.1.0" }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
