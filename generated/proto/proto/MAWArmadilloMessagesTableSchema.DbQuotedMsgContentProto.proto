message DbQuotedMsgContentProto {
  optional bytes type = 1;
  optional bytes ts = 2;
  optional bytes externalId = 3;
  optional bytes author = 4;
  optional MsgContentProto msgContent = 5;
  optional QuotedDbMediaProto obsoleteMedia = 6;
  optional bytes msgId = 7;
  optional bytes mediaId = 8;
  optional bytes sourceId = 9;
  optional bytes xmaMessageType = 10;
  optional bytes specialTextSize = 11;
  optional bytes plaintextHash = 12;
  optional bytes expirationTs = 13;
}