message EmbeddedMusic {
  optional bytes musicContentMediaId = 1;
  optional bytes songId = 2;
  optional bytes author = 3;
  optional bytes title = 4;
  optional bytes artworkDirectPath = 5;
  optional bytes artworkSha256 = 6;
  optional bytes artworkEncSha256 = 7;
  optional bytes artistAttribution = 8;
  optional bytes countryBlocklist = 9;
  optional bytes isExplicit = 10;
  optional bytes artworkMediaKey = 11;
  optional bytes musicSongStartTimeInMs = 12;
  optional bytes derivedContentStartTimeInMs = 13;
  optional bytes overlapDurationInMs = 14;
}