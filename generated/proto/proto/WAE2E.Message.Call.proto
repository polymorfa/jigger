message Call {
  optional bytes callKey = 1;
  optional bytes conversionSource = 2;
  optional bytes conversionData = 3;
  optional bytes conversionDelaySeconds = 4;
  optional bytes ctwaSignals = 5;
  optional bytes ctwaPayload = 6;
  optional ContextInfo contextInfo = 7;
  optional bytes nativeFlowCallButtonPayload = 8;
  optional bytes deeplinkPayload = 9;
  optional MessageContextInfo messageContextInfo = 10;
  optional bytes callEntryPoint = 11;
}