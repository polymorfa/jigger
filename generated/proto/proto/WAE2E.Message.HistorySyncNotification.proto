message HistorySyncNotification {
  optional bytes fileSha256 = 1;
  optional bytes fileLength = 2;
  optional bytes mediaKey = 3;
  optional bytes fileEncSha256 = 4;
  optional bytes directPath = 5;
  optional bytes syncType = 6;
  optional bytes chunkOrder = 7;
  optional bytes originalMessageId = 8;
  optional bytes progress = 9;
  optional bytes oldestMsgInChunkTimestampSec = 10;
  optional bytes initialHistBootstrapInlinePayload = 11;
  optional bytes peerDataRequestSessionId = 12;
  optional FullHistorySyncOnDemandRequestMetadata fullHistorySyncOnDemandRequestMetadata = 13;
  optional bytes encHandle = 14;
  optional HistorySyncMessageAccessStatus messageAccessStatus = 15;
}