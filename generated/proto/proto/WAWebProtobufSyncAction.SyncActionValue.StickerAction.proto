message StickerAction {
  optional bytes url = 1;
  optional bytes fileEncSha256 = 2;
  optional bytes mediaKey = 3;
  optional bytes mimetype = 4;
  optional bytes height = 5;
  optional bytes width = 6;
  optional bytes directPath = 7;
  optional bytes fileLength = 8;
  optional bytes isFavorite = 9;
  optional bytes deviceIdHint = 10;
  optional bytes isLottie = 11;
  optional bytes imageHash = 12;
  optional bytes isAvatarSticker = 13;
}