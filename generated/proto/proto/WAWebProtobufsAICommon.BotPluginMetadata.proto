message BotPluginMetadata {
  optional bytes provider = 1;
  optional bytes pluginType = 2;
  optional bytes thumbnailCdnUrl = 3;
  optional bytes profilePhotoCdnUrl = 4;
  optional bytes searchProviderUrl = 5;
  optional bytes referenceIndex = 6;
  optional bytes expectedLinksCount = 7;
  optional bytes searchQuery = 9;
  optional bytes parentPluginMessageKey = 10;
  optional bytes deprecatedField = 11;
  optional bytes parentPluginType = 12;
  optional bytes faviconCdnUrl = 13;
}