message DeviceListMetadata {
  optional bytes senderKeyHash = 1;
  optional bytes senderTimestamp = 2;
  optional bytes senderKeyIndexes = 3;
  optional bytes senderAccountType = 4;
  optional bytes receiverAccountType = 5;
  optional bytes recipientKeyHash = 8;
  optional bytes recipientTimestamp = 9;
  optional bytes recipientKeyIndexes = 10;
}