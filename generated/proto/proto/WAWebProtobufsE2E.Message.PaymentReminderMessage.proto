message PaymentReminderMessage {
  optional bytes reminderId = 1;
  optional bytes instanceId = 2;
  optional bytes description = 3;
  optional bytes frequency = 4;
  optional bytes status = 5;
  optional bytes payeeVpa = 6;
  optional bytes payeeJid = 7;
  optional bytes payerJid = 8;
  optional Money amount = 9;
}