message MessageContextInfo {
  optional DeviceListMetadata deviceListMetadata = 1;
  optional bytes deviceListMetadataVersion = 2;
  optional bytes messageSecret = 3;
  optional bytes paddingBytes = 4;
  optional bytes messageAddOnDurationInSecs = 5;
  optional bytes botMessageSecret = 6;
  optional bytes botMetadata = 7;
  optional bytes reportingTokenVersion = 8;
  optional bytes messageAddOnExpiryType = 9;
  optional MessageAssociation messageAssociation = 10;
  optional bytes capiCreatedGroup = 11;
  optional bytes supportPayload = 12;
  optional bytes limitSharing = 13;
  optional bytes limitSharingV2 = 14;
  optional ThreadID threadId = 15;
  optional bytes weblinkRenderConfig = 16;
  optional bytes teeBotMetadata = 17;
  optional bytes accountEncryptionAttestation = 18;
  optional bytes associatedPrimaryIdentityKey = 19;
}