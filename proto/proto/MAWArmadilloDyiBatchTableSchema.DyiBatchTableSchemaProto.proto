message DyiBatchTableSchemaProto {
  optional bytes batchId = 1;
  optional bytes numMessages = 2;
  optional bytes oldestTs = 3;
  optional bytes threadId = 4;
  optional bytes isThread = 5;
  optional bytes numMessagesRestored = 6;
  optional bytes qplInstanceKeyForThread = 7;
  optional bytes qplFlowDescriptor = 8;
  optional bytes qplInstanceKeyE2E = 9;
  optional bytes numThreadsRestored = 10;
}