message BusinessBroadcastCampaignAction {
  optional bytes deviceId = 1;
  optional bytes adId = 2;
  optional bytes name = 3;
  optional bytes msgId = 4;
  optional bytes broadcastJid = 5;
  optional bytes reservedQuota = 6;
  optional bytes scheduledTimestamp = 7;
  optional bytes createTimestamp = 8;
  optional bytes status = 9;
}