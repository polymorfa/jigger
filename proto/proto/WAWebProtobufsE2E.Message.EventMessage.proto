message EventMessage {
  optional ContextInfo contextInfo = 1;
  optional bytes isCanceled = 2;
  optional bytes name = 3;
  optional bytes description = 4;
  optional LocationMessage location = 5;
  optional bytes joinLink = 6;
  optional bytes startTime = 7;
  optional bytes endTime = 8;
  optional bytes extraGuestsAllowed = 9;
  optional bytes isScheduleCall = 10;
  optional bytes hasReminder = 11;
  optional bytes reminderOffsetSec = 12;
}