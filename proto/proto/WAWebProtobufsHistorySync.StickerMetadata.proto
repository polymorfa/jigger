message StickerMetadata {
  optional bytes url = 1;
  optional bytes fileSha256 = 2;
  optional bytes fileEncSha256 = 3;
  optional bytes mediaKey = 4;
  optional bytes mimetype = 5;
  optional bytes height = 6;
  optional bytes width = 7;
  optional bytes directPath = 8;
  optional bytes fileLength = 9;
  optional bytes weight = 10;
  optional bytes lastStickerSentTs = 11;
  optional bytes isLottie = 12;
  optional bytes imageHash = 13;
  optional bytes isAvatarSticker = 14;
}